<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPNsense Insight</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="rail" data-i18n-label="nav.label">
    <a class="rail-logo" href="#top" title="OPNsense Insight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.8 3.8L12 11.9 5.2 8.1 12 4.3ZM5 9.8l6 3.4v6.6l-6-3.3V9.8Zm8 10V13.2l6-3.4v6.7l-6 3.3Z"/></svg>
    </a>
    <a href="#top" class="rail-item active" data-i18n-title="nav.overview"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/></svg></a>
    <a href="#sec-traffic" class="rail-item" data-i18n-title="nav.traffic"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9 1.5 1.3L12 18l-4-4-3.5 4.2L3 17Z"/></svg></a>
    <a href="#sec-services" class="rail-item" data-i18n-title="nav.services"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.9 6h-3a15.7 15.7 0 0 0-1.3-3.9A8 8 0 0 1 18.9 8ZM12 4a13.8 13.8 0 0 1 1.9 4h-3.8A13.8 13.8 0 0 1 12 4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.6 16.6 0 0 0 0 4H4.3Zm.8 2h3a15.7 15.7 0 0 0 1.3 3.9A8 8 0 0 1 5.1 16Zm3-8h-3a8 8 0 0 1 4.3-3.9A15.7 15.7 0 0 0 8.1 8ZM12 20a13.8 13.8 0 0 1-1.9-4h3.8A13.8 13.8 0 0 1 12 20Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.3 5.9a15.7 15.7 0 0 0 1.3-3.9h3a8 8 0 0 1-4.3 3.9ZM16.3 14a16.6 16.6 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4Z"/></svg></a>
    <a href="#sec-clients" class="rail-item" data-i18n-title="nav.clients"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H4V5Zm-2 0v10a2 2 0 0 0 2 2h6v2H7v2h10v-2h-3v-2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/></svg></a>
    <a href="#sec-system" class="rail-item" data-i18n-title="nav.system"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM13 15.5a3.5 3.5 0 1 1 3.5-3.5 3.5 3.5 0 0 1-3.5 3.5Z" transform="translate(-1 0)"/></svg></a>
    <button class="rail-item rail-bottom" id="theme-toggle" data-i18n-title="nav.theme">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
  </aside>

  <div class="page" id="top">
    <header class="topbar">
      <div class="site">
        <div class="site-name">OPNsense Insight</div>
        <div class="site-sub"><span id="hostname" data-i18n="top.connecting"></span><span class="dot-sep">·</span><span id="firmware"></span></div>
      </div>
      <div class="topbar-right">
        <span class="badge badge-demo" id="demo-badge" hidden data-i18n="top.demo"></span>
        <span class="live-pill" id="live-pill"><i></i><span data-i18n="top.live"></span></span>
        <div class="seg" role="tablist" data-i18n-label="top.range" id="range-seg">
          <button data-range="1h" data-i18n="range.1h"></button>
          <button data-range="24h" class="on" data-i18n="range.24h"></button>
          <button data-range="7d" data-i18n="range.7d"></button>
          <button data-range="30d" data-i18n="range.30d"></button>
        </div>
      </div>
    </header>

    <main class="grid">
      <!-- Internet hero -->
      <section class="card hero" aria-labelledby="h-internet">
        <div class="card-head">
          <h2 id="h-internet" data-i18n="internet.title"></h2>
          <span class="status" id="wan-status"><i></i><span>–</span></span>
        </div>
        <div class="hero-body">
          <div class="hero-rate">
            <div class="rate-line"><span class="arrow down" aria-hidden="true">↓</span><span class="big" id="wan-rx">–</span></div>
            <div class="rate-label" data-i18n="internet.download"></div>
          </div>
          <div class="hero-rate">
            <div class="rate-line"><span class="arrow up" aria-hidden="true">↑</span><span class="big" id="wan-tx">–</span></div>
            <div class="rate-label" data-i18n="internet.upload"></div>
          </div>
          <div class="hero-meta">
            <div><span class="k" data-i18n="internet.latency"></span><span class="v" id="wan-latency">–</span></div>
            <div><span class="k" data-i18n="internet.loss"></span><span class="v" id="wan-loss">–</span></div>
            <div><span class="k" data-i18n="internet.gateway"></span><span class="v" id="wan-gw">–</span></div>
          </div>
        </div>
        <canvas class="spark" id="hero-spark" aria-hidden="true"></canvas>
      </section>

      <div class="tiles">
      <section class="card tile"><div class="tile-k" data-i18n="tile.todayRx"></div><div class="tile-v" id="today-rx">–</div><div class="tile-s" id="today-rx-s">&nbsp;</div></section>
      <section class="card tile"><div class="tile-k" data-i18n="tile.todayTx"></div><div class="tile-v" id="today-tx">–</div><div class="tile-s" id="today-tx-s">&nbsp;</div></section>
      <section class="card tile"><div class="tile-k" data-i18n="tile.states"></div><div class="tile-v" id="states">–</div><div class="tile-s" id="states-s" data-i18n="tile.statesSub"></div></section>
      <section class="card tile"><div class="tile-k" data-i18n="tile.clients"></div><div class="tile-v" id="clients-online">–</div><div class="tile-s" data-i18n="tile.clientsSub"></div></section>
      </div>

      <!-- Throughput -->
      <section class="card span-8" id="sec-traffic" aria-labelledby="h-traffic">
        <div class="card-head">
          <h2 id="h-traffic" data-i18n="tp.title"></h2>
          <div class="legend"><span class="lg dl"></span><span data-i18n="internet.download"></span> <span class="lg ul"></span><span data-i18n="internet.upload"></span></div>
          <div class="seg seg-sm" id="tp-mode">
            <button data-mode="live" class="on" data-i18n="tp.live"></button>
            <button data-mode="range" data-i18n="tp.range"></button>
          </div>
        </div>
        <div class="chart-wrap tall"><canvas id="tp-chart"></canvas><div class="tip" id="tp-tip"></div></div>
        <div class="card-foot" id="tp-foot">&nbsp;</div>
      </section>

      <!-- Category donut -->
      <section class="card span-4" aria-labelledby="h-cat">
        <div class="card-head"><h2 id="h-cat" data-i18n="cat.title"></h2><span class="muted small" id="cat-range"></span></div>
        <div class="donut-wrap">
          <div class="chart-wrap donut"><canvas id="cat-donut"></canvas><div class="donut-center"><div class="dc-v" id="cat-total">–</div><div class="dc-k" data-i18n="cat.total"></div></div><div class="tip" id="cat-tip"></div></div>
          <ul class="legend-list" id="cat-legend"></ul>
        </div>
      </section>

      <!-- Daily trend -->
      <section class="card span-12" aria-labelledby="h-daily">
        <div class="card-head">
          <h2 id="h-daily" data-i18n="daily.title"></h2>
          <div class="legend" id="daily-legend"></div>
          <div class="seg seg-sm" id="daily-mode">
            <button data-mode="dir" class="on" data-i18n="daily.dir"></button>
            <button data-mode="cat" data-i18n="daily.cat"></button>
          </div>
          <div class="seg seg-sm" id="daily-days">
            <button data-days="14" class="on"></button>
            <button data-days="30"></button>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="daily-chart"></canvas><div class="tip" id="daily-tip"></div></div>
      </section>

      <!-- Services / clients / networks -->
      <section class="card span-4" id="sec-services" aria-labelledby="h-svc">
        <div class="card-head"><h2 id="h-svc" data-i18n="svc.title"></h2><span class="muted small range-label"></span></div>
        <ol class="toplist" id="list-service"></ol>
        <div class="card-foot" id="svc-foot">&nbsp;</div>
      </section>
      <section class="card span-4" id="sec-clients" aria-labelledby="h-cli">
        <div class="card-head"><h2 id="h-cli" data-i18n="cli.title"></h2><span class="muted small range-label"></span></div>
        <ol class="toplist" id="list-client"></ol>
      </section>
      <section class="card span-4" aria-labelledby="h-asn">
        <div class="card-head"><h2 id="h-asn" data-i18n="asn.title"></h2><span class="muted small" data-i18n="asn.sub"></span></div>
        <ol class="toplist" id="list-asn"></ol>
      </section>

      <!-- Live now / destinations / countries -->
      <section class="card span-4" aria-labelledby="h-now">
        <div class="card-head"><h2 id="h-now" data-i18n="now.title"></h2><span class="live-dot" aria-hidden="true"></span></div>
        <div class="seg seg-sm seg-block" id="now-mode">
          <button data-mode="services" class="on" data-i18n="now.services"></button>
          <button data-mode="talkers" data-i18n="now.clients"></button>
          <button data-mode="dests" data-i18n="now.dests"></button>
        </div>
        <ol class="toplist live" id="list-now"></ol>
      </section>
      <section class="card span-4" aria-labelledby="h-dest">
        <div class="card-head"><h2 id="h-dest" data-i18n="dest.title"></h2><span class="muted small" data-i18n="dest.sub"></span></div>
        <ol class="toplist" id="list-dest"></ol>
      </section>
      <section class="card span-4" aria-labelledby="h-country">
        <div class="card-head"><h2 id="h-country" data-i18n="country.title"></h2><span class="muted small range-label"></span></div>
        <ol class="toplist" id="list-country"></ol>
      </section>

      <!-- Interfaces + system -->
      <section class="card span-8" aria-labelledby="h-if">
        <div class="card-head"><h2 id="h-if" data-i18n="if.title"></h2></div>
        <div class="table-scroll">
          <table class="iftable">
            <thead><tr><th data-i18n="if.name"></th><th class="num" data-i18n="if.rxNow"></th><th class="num" data-i18n="if.txNow"></th><th class="num" data-i18n="if.rxDay"></th><th class="num" data-i18n="if.txDay"></th><th class="spark-col" data-i18n="if.trend"></th></tr></thead>
            <tbody id="if-body"></tbody>
          </table>
        </div>
      </section>
      <section class="card span-4" id="sec-system" aria-labelledby="h-sys">
        <div class="card-head"><h2 id="h-sys" data-i18n="sys.title"></h2></div>
        <dl class="kv" id="sys-kv"></dl>
        <div class="meter"><div class="meter-k"><span data-i18n="sys.memory"></span><span id="mem-v">–</span></div><div class="meter-bar"><i id="mem-bar"></i></div></div>
        <div class="gw-list" id="gw-list"></div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
